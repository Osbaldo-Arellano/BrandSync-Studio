<!--
  TEMPLATE: business-card / light  (FRONT)
  CLIENT:   Flawless Roofing and Construction
  SIZE:     3.5in × 2in
  TOKENS:   {{logo}} {{name}} {{title}} {{phone}} {{email}} {{website}} {{tagline}}

  LOCAL PREVIEW: open this file in a browser.
  DB INSERT:     strip the <script> block, insert the rest into html_body.
-->
<script>
const PREVIEW = {
  logo:    "https://knhgoaphmtewjhtvglpe.supabase.co/storage/v1/object/public/logos/FLAWLESS_ROOFING_LOGO-removebg-preview.png",
  name:    "Rene Morales",
  title:   "Owner / Operator",
  phone:   "(971) 289-1360",
  email:   "renemora94@gmail.com",
  website: "flawlessroofings.com",
  tagline: "Licensed, Bonded, Insured",
};
document.addEventListener("DOMContentLoaded", () => {
  document.body.innerHTML = document.body.innerHTML
    .replace(/\{\{(\w+)\}\}/g, (_, k) => PREVIEW[k] ?? "");
});
</script>
<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
  @page { size: 3.5in 2in; margin: 0; }
  html, body {
    width: 3.5in; height: 2in;
    overflow: hidden;
    font-family: 'Inter', system-ui, sans-serif;
    -webkit-print-color-adjust: exact;
    print-color-adjust: exact;
  }

  .card {
    width: 3.5in; height: 2in;
    background: #111318;
    position: relative;
    overflow: hidden;
  }

  /* Amber roof-peak corner triangle */
  .peak-outer {
    position: absolute; top: 0; right: 0;
    width: 0; height: 0;
    border-style: solid;
    border-width: 0 88px 88px 0;
    border-color: transparent rgba(201,123,26,0.22) transparent transparent;
  }
  .peak-inner {
    position: absolute; top: 0; right: 0;
    width: 0; height: 0;
    border-style: solid;
    border-width: 0 58px 58px 0;
    border-color: transparent #C97B1A transparent transparent;
  }

  /* Left amber bar */
  .left-bar {
    position: absolute;
    left: 0; top: 0; bottom: 0;
    width: 3.5px;
    background: #C97B1A;
  }

  /* Subtle diagonal texture */
  .texture {
    position: absolute; inset: 0;
    background-image: repeating-linear-gradient(
      -55deg,
      transparent, transparent 18px,
      rgba(255,255,255,0.018) 18px, rgba(255,255,255,0.018) 19px
    );
  }

  .inner {
    position: absolute;
    inset: 0 0 20px 0;
    padding: 15px 18px 0 18px;
    display: flex;
    flex-direction: column;
  }

  .top-row {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    margin-bottom: 11px;
  }

  .logo {
    height: 30px; width: auto; max-width: 130px;
    object-fit: contain; object-position: left;
    filter: brightness(0) invert(1);
  }

  .ccb {
    font-size: 6px;
    color: rgba(255,255,255,0.22);
    text-align: right;
    line-height: 1.7;
    padding-right: 8px;
  }

  .rule {
    width: 24px; height: 2.5px;
    background: #C97B1A;
    margin-bottom: 8px;
  }

  .name {
    font-size: 17px;
    font-weight: 800;
    color: #ffffff;
    letter-spacing: -0.03em;
    line-height: 1.05;
    margin-bottom: 3px;
  }

  .title {
    font-size: 7px;
    font-weight: 600;
    color: #C97B1A;
    text-transform: uppercase;
    letter-spacing: 0.13em;
    margin-bottom: 10px;
  }

  .contact { display: flex; flex-direction: column; gap: 3px; }

  .c {
    font-size: 7.5px;
    color: rgba(255,255,255,0.45);
    letter-spacing: 0.01em;
    line-height: 1;
  }

  /* Amber footer bar */
  .footer {
    position: absolute;
    bottom: 0; left: 0; right: 0;
    height: 20px;
    background: #C97B1A;
    display: flex;
    align-items: center;
    padding: 0 18px;
    gap: 7px;
  }

  .diamond {
    width: 4px; height: 4px;
    background: rgba(255,255,255,0.55);
    transform: rotate(45deg);
    flex-shrink: 0;
  }

  .tagline-text {
    font-size: 6.5px;
    font-weight: 700;
    color: #fff;
    letter-spacing: 0.11em;
    text-transform: uppercase;
  }
</style>
</head>
<body>
<div class="card">
  <div class="texture"></div>
  <div class="left-bar"></div>
  <div class="peak-outer"></div>
  <div class="peak-inner"></div>

  <div class="inner">
    <div class="top-row">
      <img class="logo" src="{{logo}}" alt="" />
      <div class="ccb">CCB# 225649</div>
    </div>
    <div class="rule"></div>
    <div class="name">{{name}}</div>
    <div class="title">{{title}}</div>
    <div class="contact">
      <div class="c">{{phone}}</div>
      <div class="c">{{email}}</div>
      <div class="c">{{website}}</div>
    </div>
  </div>

  <div class="footer">
    <div class="diamond"></div>
    <div class="tagline-text">{{tagline}}</div>
  </div>
</div>
</body>
</html>
