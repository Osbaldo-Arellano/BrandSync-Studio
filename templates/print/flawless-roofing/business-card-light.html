<!--
  TEMPLATE: business-card / light
  CLIENT:   Flawless Roofing and Construction
  SIZE:     3.5in × 2in
  TOKENS:   {{logo}} {{name}} {{title}} {{phone}} {{email}} {{website}} {{tagline}}

  LOCAL PREVIEW: open this file in a browser — the <script> below fills in sample data.
  DB INSERT:     strip the <script> block, then insert html_body into tenant_asset_templates.
-->
<script>
const PREVIEW = {
  logo:    "https://flawless-construction.vercel.app/_next/image?url=%2Flogo.png&w=384&q=75",
  name:    "Rene Morales",
  title:   "Owner / Operator",
  phone:   "(971) 289-1360",
  email:   "renemora94@gmail.com",
  website: "flawlessroofings.com",
  tagline: "Licensed, Bonded, Insured",
};
document.addEventListener("DOMContentLoaded", () => {
  document.body.innerHTML = document.body.innerHTML
    .replace(/\{\{(\w+)\}\}/g, (_, k) => PREVIEW[k] ?? "");
});
</script>
<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
  @page { size: 3.5in 2in; margin: 0; }
  html, body {
    width: 3.5in; height: 2in;
    overflow: hidden;
    background: #fff;
    font-family: 'Inter', system-ui, sans-serif;
    -webkit-print-color-adjust: exact;
    print-color-adjust: exact;
  }
  .card {
    width: 3.5in; height: 2in;
    padding: 18px 22px 14px 26px;
    display: flex; flex-direction: column;
    justify-content: space-between;
    position: relative;
  }
  .card::before {
    content: ''; position: absolute;
    left: 0; top: 0; bottom: 0; width: 4px;
    background: #C97B1A;
  }
  .top { display: flex; align-items: flex-start; justify-content: space-between; }
  .logo { height: 28px; width: auto; max-width: 130px; object-fit: contain; object-position: left center; }
  .ccb { font-size: 6.5px; color: #aaa; text-align: right; line-height: 1.5; }
  .middle { flex: 1; display: flex; flex-direction: column; justify-content: flex-end; padding-bottom: 2px; }
  .name { font-size: 13.5px; font-weight: 700; color: #1a1a1a; letter-spacing: -0.02em; line-height: 1.2; }
  .job-title { font-size: 7.5px; font-weight: 600; color: #C97B1A; text-transform: uppercase; letter-spacing: 0.09em; margin-top: 2.5px; }
  .contact { margin-top: 8px; display: flex; flex-direction: column; gap: 3px; }
  .contact-line { display: flex; align-items: center; gap: 5px; font-size: 7.5px; color: #555; line-height: 1; }
  .bullet { width: 3px; height: 3px; background: #C97B1A; border-radius: 50%; flex-shrink: 0; }
  .bottom { border-top: 0.75px solid #ebebeb; padding-top: 6px; }
  .tagline { font-size: 7px; color: #999; font-style: italic; }
</style>
</head>
<body>
<div class="card">
  <div class="top">
    <img class="logo" src="{{logo}}" alt="" />
    <div class="ccb">CCB# 225649</div>
  </div>
  <div class="middle">
    <div class="name">{{name}}</div>
    <div class="job-title">{{title}}</div>
    <div class="contact">
      <div class="contact-line"><span class="bullet"></span>{{phone}}</div>
      <div class="contact-line"><span class="bullet"></span>{{email}}</div>
      <div class="contact-line"><span class="bullet"></span>{{website}}</div>
    </div>
  </div>
  <div class="bottom">
    <div class="tagline">{{tagline}}</div>
  </div>
</div>
</body>
</html>
