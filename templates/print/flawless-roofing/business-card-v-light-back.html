<!--
  TEMPLATE: business-card-v / light-back  (BACK)
  CLIENT:   Flawless Roofing and Construction
  SIZE:     2in × 3.5in  (portrait)
  TOKENS:   {{logo}} {{qr_code}} {{website}} {{tagline}}

  LOCAL PREVIEW: open in browser.
  DB INSERT:     strip the <script> block, insert the rest into html_body.
-->
<script>
const qrPlaceholder = `<svg viewBox="0 0 100 100" width="100%" height="100%" xmlns="http://www.w3.org/2000/svg">
  <rect width="100" height="100" fill="#f5f5f5" rx="2"/>
  <text x="50" y="55" text-anchor="middle" font-size="9" fill="#bbb" font-family="sans-serif">QR CODE</text>
</svg>`;
const PREVIEW = {
  logo:    "https://knhgoaphmtewjhtvglpe.supabase.co/storage/v1/object/public/logos/FLAWLESS_ROOFING_LOGO-removebg-preview.png",
  qr_code: qrPlaceholder,
  website: "FlawlessRoofings.com",
  tagline: "Licensed, Bonded, Insured",
};
document.addEventListener("DOMContentLoaded", () => {
  document.body.innerHTML = document.body.innerHTML
    .replace(/\{\{(\w+)\}\}/g, (_, k) => PREVIEW[k] ?? "");
});
</script>
<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
  @page { size: 2in 3.5in; margin: 0; }
  html, body {
    width: 2in; height: 3.5in;
    overflow: hidden;
    font-family: 'Inter', system-ui, sans-serif;
    background: #fff;
    -webkit-print-color-adjust: exact;
    print-color-adjust: exact;
  }

  .card {
    width: 2in; height: 3.5in;
    background: #ffffff;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 14px 14px 12px;
  }

  /* ── Logo ── */
  .logo {
    height: 36px; width: auto; max-width: 160px;
    object-fit: contain;
    align-self: flex-start;
    margin-bottom: 14px;
  }

  /* ── Tagline ── */
  .tagline {
    font-size: 9.5px;
    font-weight: 900;
    color: #C97B1A;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    line-height: 1.3;
    align-self: flex-start;
    margin-bottom: 14px;
  }

  /* ── QR code ── */
  .qr-wrap {
    width: 130px; height: 130px;
    flex-shrink: 0;
    margin-bottom: 8px;
  }
  .qr-wrap svg, .qr-wrap img {
    width: 100%; height: 100%;
    display: block;
  }

  /* ── Review prompt ── */
  .review {
    font-size: 7.5px;
    font-weight: 600;
    color: #C97B1A;
    letter-spacing: 0.02em;
    margin-bottom: 14px;
  }

  /* ── Spacer ── */
  .spacer { flex: 1; }

  /* ── Website button ── */
  .website-btn {
    width: 100%;
    background: #C97B1A;
    border-radius: 5px;
    padding: 8px 12px;
    font-size: 8px;
    font-weight: 700;
    color: #fff;
    text-align: center;
    letter-spacing: 0.01em;
    line-height: 1;
  }
</style>
</head>
<body>
<div class="card">
  <img class="logo" src="{{logo}}" alt="" />

  <div class="tagline">{{tagline}}</div>

  <div class="qr-wrap">{{qr_code}}</div>

  <div class="review">Leave us a review! ↑</div>

  <div class="spacer"></div>

  <div class="website-btn">{{website}}</div>
</div>
</body>
</html>
