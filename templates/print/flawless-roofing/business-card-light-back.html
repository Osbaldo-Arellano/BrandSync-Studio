<!--
  TEMPLATE: business-card / light-back  (BACK)
  CLIENT:   Flawless Roofing and Construction
  SIZE:     3.5in × 2in
  TOKENS:   {{logo}} {{qr_code}} {{website}} {{phone}} {{tagline}}

  LOCAL PREVIEW: open this file in a browser.
  DB INSERT:     strip the <script> block, insert the rest into html_body.
-->
<script>
// Minimal QR placeholder for local preview (real QR generated server-side via {{qr_code}})
const qrPlaceholder = `<svg viewBox="0 0 100 100" width="100" height="100" xmlns="http://www.w3.org/2000/svg">
  <rect width="100" height="100" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="2"/>
  <text x="50" y="54" text-anchor="middle" font-size="9" fill="rgba(255,255,255,0.3)" font-family="sans-serif">QR CODE</text>
</svg>`;
const PREVIEW = {
  logo:    "https://knhgoaphmtewjhtvglpe.supabase.co/storage/v1/object/public/logos/FLAWLESS_ROOFING_LOGO-removebg-preview.png",
  qr_code: qrPlaceholder,
  website: "flawlessroofings.com",
  phone:   "(971) 289-1360",
  tagline: "Licensed, Bonded, Insured",
};
document.addEventListener("DOMContentLoaded", () => {
  document.body.innerHTML = document.body.innerHTML
    .replace(/\{\{(\w+)\}\}/g, (_, k) => PREVIEW[k] ?? "");
});
</script>
<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
  @page { size: 3.5in 2in; margin: 0; }
  html, body {
    width: 3.5in; height: 2in;
    overflow: hidden;
    font-family: 'Inter', system-ui, sans-serif;
    -webkit-print-color-adjust: exact;
    print-color-adjust: exact;
  }

  .card {
    width: 3.5in; height: 2in;
    background: #111318;
    position: relative;
    overflow: hidden;
  }

  /* Subtle diagonal texture matching front */
  .texture {
    position: absolute; inset: 0;
    background-image: repeating-linear-gradient(
      -55deg,
      transparent, transparent 18px,
      rgba(255,255,255,0.018) 18px, rgba(255,255,255,0.018) 19px
    );
  }

  /* Amber diagonal header — slanted bottom edge */
  .header {
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 68px;
    background: #C97B1A;
    clip-path: polygon(0 0, 100% 0, 100% 52px, 0 68px);
    display: flex;
    align-items: flex-start;
    padding: 13px 18px 0;
    justify-content: space-between;
  }

  .logo {
    height: 28px; width: auto; max-width: 140px;
    object-fit: contain; object-position: left;
    filter: brightness(0) invert(1);
  }

  .tagline-top {
    font-size: 6.5px;
    font-weight: 600;
    color: rgba(255,255,255,0.75);
    text-transform: uppercase;
    letter-spacing: 0.1em;
    text-align: right;
    line-height: 1.5;
    padding-top: 3px;
  }

  /* Services grid */
  .services {
    position: absolute;
    top: 76px; left: 18px;
    right: 110px;
  }

  .services-label {
    font-size: 6px;
    font-weight: 700;
    color: rgba(255,255,255,0.3);
    text-transform: uppercase;
    letter-spacing: 0.15em;
    margin-bottom: 7px;
  }

  .grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 4px 10px;
  }

  .service {
    display: flex;
    align-items: center;
    gap: 5px;
    font-size: 7.5px;
    font-weight: 500;
    color: rgba(255,255,255,0.75);
    line-height: 1;
  }

  .service::before {
    content: '';
    width: 3px; height: 3px;
    background: #C97B1A;
    transform: rotate(45deg);
    flex-shrink: 0;
  }

  /* QR code column */
  .qr-col {
    position: absolute;
    top: 72px; right: 14px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
  }

  .qr-wrap {
    width: 72px; height: 72px;
    background: #fff;
    border-radius: 2px;
    padding: 4px;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .qr-wrap svg, .qr-wrap img {
    width: 100%; height: 100%;
  }

  .scan-label {
    font-size: 5.5px;
    color: rgba(255,255,255,0.3);
    text-transform: uppercase;
    letter-spacing: 0.12em;
    text-align: center;
  }

  /* Bottom footer */
  .footer {
    position: absolute;
    bottom: 0; left: 0; right: 0;
    height: 20px;
    border-top: 1px solid rgba(255,255,255,0.07);
    display: flex;
    align-items: center;
    padding: 0 18px;
    justify-content: space-between;
  }

  .footer-left {
    font-size: 6.5px;
    color: rgba(255,255,255,0.28);
    letter-spacing: 0.03em;
  }

  .footer-right {
    font-size: 6.5px;
    color: rgba(255,255,255,0.28);
  }
</style>
</head>
<body>
<div class="card">
  <div class="texture"></div>

  <div class="header">
    <img class="logo" src="{{logo}}" alt="" />
    <div class="tagline-top">{{tagline}}</div>
  </div>

  <div class="services">
    <div class="services-label">Our Services</div>
    <div class="grid">
      <div class="service">Roofing</div>
      <div class="service">Gutters</div>
      <div class="service">Siding</div>
      <div class="service">Construction</div>
      <div class="service">Skylights</div>
      <div class="service">Repairs</div>
    </div>
  </div>

  <div class="qr-col">
    <div class="qr-wrap">{{qr_code}}</div>
    <div class="scan-label">Scan to visit us</div>
  </div>

  <div class="footer">
    <div class="footer-left">CCB# 225649 &nbsp;·&nbsp; Portland, OR</div>
    <div class="footer-right">{{phone}}</div>
  </div>
</div>
</body>
</html>
