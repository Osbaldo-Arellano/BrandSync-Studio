<!--
  TEMPLATE: business-card / light  (FRONT)
  CLIENT:   Flawless Roofing and Construction
  SIZE:     3.5in × 2in
  TOKENS:   {{logo}} {{name}} {{title}} {{phone}} {{email}} {{website}} {{tagline}}

  LOCAL PREVIEW: open this file in a browser.
  DB INSERT:     strip the <script> block, insert the rest into html_body.
-->
<script>
const PREVIEW = {
  logo:    "https://knhgoaphmtewjhtvglpe.supabase.co/storage/v1/object/public/logos/FLAWLESS_ROOFING_LOGO-removebg-preview.png",
  name:    "Rene Morales",
  title:   "Owner / Operator",
  phone:   "(971) 289-1360",
  email:   "renemora94@gmail.com",
  website: "flawlessroofings.com",
  tagline: "Licensed, Bonded, Insured",
};
document.addEventListener("DOMContentLoaded", () => {
  document.body.innerHTML = document.body.innerHTML
    .replace(/\{\{(\w+)\}\}/g, (_, k) => PREVIEW[k] ?? "");
});
</script>
<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
  @page { size: 3.5in 2in; margin: 0; }
  html, body {
    width: 3.5in; height: 2in;
    overflow: hidden;
    font-family: 'Inter', system-ui, sans-serif;
    -webkit-print-color-adjust: exact;
    print-color-adjust: exact;
  }

  .card {
    width: 3.5in; height: 2in;
    background: #111318;
    position: relative;
    overflow: hidden;
    /* Subtle diagonal texture */
    background-image: repeating-linear-gradient(
      -55deg,
      transparent, transparent 18px,
      rgba(255,255,255,0.018) 18px, rgba(255,255,255,0.018) 19px
    );
  }

  /* Amber roof-peak corner */
  .peak-outer {
    position: absolute; top: 0; right: 0;
    width: 0; height: 0;
    border-style: solid;
    border-width: 0 72px 72px 0;
    border-color: transparent rgba(201,123,26,0.2) transparent transparent;
  }
  .peak-inner {
    position: absolute; top: 0; right: 0;
    width: 0; height: 0;
    border-style: solid;
    border-width: 0 46px 46px 0;
    border-color: transparent #C97B1A transparent transparent;
  }

  /* Content box — margins on all four sides */
  .box {
    position: absolute;
    inset: 14px 16px 14px 16px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
  }

  /* ── Top row: logo + CCB ── */
  .top {
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .logo {
    height: 26px; width: auto; max-width: 120px;
    object-fit: contain; object-position: left;
    filter: brightness(0) invert(1);
  }
  .ccb {
    font-size: 6px;
    color: rgba(255,255,255,0.22);
    text-align: right;
    line-height: 1.6;
    padding-right: 6px; /* clear the corner triangle */
  }

  /* ── Amber rule ── */
  .rule {
    width: 20px; height: 2px;
    background: #C97B1A;
  }

  /* ── Middle: name + title ── */
  .mid { display: flex; flex-direction: column; gap: 2px; }
  .name {
    font-size: 16px;
    font-weight: 800;
    color: #fff;
    letter-spacing: -0.03em;
    line-height: 1.05;
  }
  .title {
    font-size: 7px;
    font-weight: 600;
    color: #C97B1A;
    text-transform: uppercase;
    letter-spacing: 0.13em;
  }

  /* ── Bottom: contact + tagline ── */
  .bottom { display: flex; flex-direction: column; gap: 4px; }
  .contact { display: flex; flex-direction: column; gap: 2.5px; }
  .c {
    font-size: 7.5px;
    color: rgba(255,255,255,0.45);
    line-height: 1;
    display: flex; align-items: center; gap: 5px;
  }
  .dot {
    width: 2.5px; height: 2.5px;
    background: #C97B1A;
    border-radius: 50%;
    flex-shrink: 0;
  }
  .divider {
    width: 100%; height: 0.75px;
    background: rgba(255,255,255,0.07);
  }
  .tagline {
    font-size: 6.5px;
    color: rgba(255,255,255,0.25);
    font-style: italic;
    letter-spacing: 0.02em;
  }
</style>
</head>
<body>
<div class="card">
  <div class="peak-outer"></div>
  <div class="peak-inner"></div>

  <div class="box">
    <div class="top">
      <img class="logo" src="{{logo}}" alt="" />
      <div class="ccb">CCB# 225649</div>
    </div>

    <div class="rule"></div>

    <div class="mid">
      <div class="name">{{name}}</div>
      <div class="title">{{title}}</div>
    </div>

    <div class="bottom">
      <div class="contact">
        <div class="c"><span class="dot"></span>{{phone}}</div>
        <div class="c"><span class="dot"></span>{{email}}</div>
        <div class="c"><span class="dot"></span>{{website}}</div>
      </div>
      <div class="divider"></div>
      <div class="tagline">{{tagline}}</div>
    </div>
  </div>
</div>
</body>
</html>
